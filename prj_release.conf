#
# Release base configuration for current measurement.
# Build with: -DFILE_SUFFIX=release
#
# Full feature set: PDM capture + Opus encoding + button recording +
# SMP over BLE. Serial/logging disabled, so no UART SMP transport.
#

# --- No serial / console / logging ---
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_LOG_PRINTK=n
CONFIG_PRINTK=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_EARLY_CONSOLE=n
# The board defconfig sets this; silence the resulting warning.
CONFIG_UART_CONSOLE=n

# --- Digital microphone ---
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y
# Button/LED come from the NCS DK library (debounce built in).
CONFIG_DK_LIBRARY=y

# --- Opus codec ---
CONFIG_OPUS=y
CONFIG_PDM_DEMO_GAIN_DB=12

# --- External flash (MX25R64 on spi00) and LittleFS ---
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
# See prj.conf: larger LittleFS cache (must match the overlay's
# cache-size, or the file-cache heap is under-allocated).
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_OGG=y

# --- MCUMgr file management over BLE ---
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_OS=y
# fs upload overflows the default 1024-byte system workqueue stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PDM_SMP"
# See prj.conf: large MTU (more data per connection event), 100-200 ms
# idle connection interval (MCUMgr temporarily speeds up during SMP
# transfers), 1 s supervision timeout.
CONFIG_BT_L2CAP_TX_MTU=988
CONFIG_BT_BUF_ACL_RX_SIZE=992
CONFIG_BT_BUF_ACL_TX_SIZE=992
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=100
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# --- Shell over SMP (fs ls etc. from the phone app) ---
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_FILE_SYSTEM_SHELL=y

# --- Device runtime power management ---
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_SPI_NOR_ACTIVE_DWELL_MS=500

# --- Application resources ---
CONFIG_ASSERT=y
