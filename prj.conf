#
# PDM power demo for nRF54L15DK
# Debug configuration with asynchronous UART logging.
#

# --- Console and serial logging ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART_ASYNC=y
CONFIG_UART_ASYNC_API=y
CONFIG_LOG_PRINTK=y
CONFIG_SHELL=n
CONFIG_CONSOLE_HANDLER=n

# --- Digital microphone ---
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y

# --- GPIO and PDM pin control ---
CONFIG_GPIO=y

# --- Opus codec ---
# Opus encoding is the default path. Set CONFIG_PDM_TEST_ONLY=y for a
# plain PDM power-measurement image (blocks discarded, no encoding).
# Shared audio parameters (sample rate, block duration, channels) are
# Kconfig options; see Kconfig for details.

# --- Application resources ---
CONFIG_ASSERT=y
