#
# PDM Opus recorder for nRF54L15 / nRF54LM20 DK
# Debug configuration with asynchronous UART logging.
#

# --- Console and serial logging ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART_ASYNC=y
CONFIG_UART_ASYNC_API=y
CONFIG_LOG_PRINTK=y
CONFIG_CONSOLE_HANDLER=n

# 4 KB layout pages for the MX25R64.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# --- Shell over SMP (run `fs ls /lfs1` etc. from the phone app) ---
# Dummy backend: no UART shell, the shell is only driven via MCUMgr.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_FILE_SYSTEM_SHELL=y

# --- Digital microphone ---
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y

# --- GPIO and PDM pin control ---
# Button/LED come from the NCS DK library (debounce built in).
CONFIG_DK_LIBRARY=y

# --- Opus codec ---
# Shared audio parameters (sample rate, block duration, channels) are
# Kconfig options; see Kconfig for details.
CONFIG_OPUS=y

# The on-board microphone is quiet; +12 dB (x4 amplitude) on the PCM
# before encoding. Applies to all configurations with storage/encoding.
CONFIG_PDM_DEMO_GAIN_DB=12

# --- External flash (MX25R64 on spi00) and LittleFS ---
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# --- Ogg container (Opus frames are stored as playable .opus files) ---
CONFIG_OGG=y

# --- MCUMgr file management (download recordings from /lfs1) ---
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_FS=y
# OS group: echo/reset, handy for connectivity checks.
CONFIG_MCUMGR_GRP_OS=y
# fs upload overflows the default 1024-byte system workqueue stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# MCUMgr BLE transport (unauthenticated, same as the smp_svr sample).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PDM_SMP"
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# --- Device runtime power management ---
# Peripherals marked zephyr,pm-device-runtime-auto in the overlays suspend
# themselves when idle. Note: dmic_nrfx_pdm has no PM support, so the
# property on pdm20 is inert until the driver gains it.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
# Keep the flash awake for a while after each access; during recording
# fs ops arrive every few ms, so the flash stays active for the whole
# clip instead of paying a deep-power-down exit per operation.
CONFIG_SPI_NOR_ACTIVE_DWELL_MS=500

# --- Application resources ---
CONFIG_ASSERT=y
