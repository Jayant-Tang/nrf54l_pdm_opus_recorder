#
# Pure PDM + Opus power baseline: button-toggled capture and encoding,
# but no storage, no LED, no SMP/BLE, no serial — so the radio and flash
# never perturb the measurement.
# Build with: -DFILE_SUFFIX=pdm_only
#

# --- No serial / console / logging ---
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_LOG_PRINTK=n
CONFIG_PRINTK=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_EARLY_CONSOLE=n
# The board defconfig sets this; silence the resulting warning.
CONFIG_UART_CONSOLE=n

# --- Digital microphone + Opus (encoded, not stored) ---
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y
# Button comes from the NCS DK library (debounce built in).
CONFIG_DK_LIBRARY=y
CONFIG_OPUS=y

# Power-baseline mode: main.c compiles out storage/LED (see Kconfig).
CONFIG_PDM_DEMO_PDM_ONLY=y

# --- Device runtime power management ---
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# --- Application resources ---
CONFIG_ASSERT=y
